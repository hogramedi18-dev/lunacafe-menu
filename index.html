<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNA Cafe & Rest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:hidden;
}

/* الصورة كاملة */

.design{
    position:relative;

    width:100vw;
    max-width:1536px;

    aspect-ratio:3 / 2;

    background-image:url("background.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
}


/* أماكن الضغط */

.link{
    position:absolute;
    display:block;

    z-index:10;

    border-radius:25px;
}


/* VIEW MENU */

.menu{
    left:32.1%;
    top:39.1%;

    width:35.8%;
    height:9.2%;
}


/* INSTAGRAM */

.instagram{
    left:32.1%;
    top:49.7%;

    width:35.8%;
    height:9.2%;
}


/* SNAPCHAT */

.snapchat{
    left:32.1%;
    top:60.2%;

    width:35.8%;
    height:9.2%;
}


/* CALL NOW */

.call{
    left:32.1%;
    top:70.8%;

    width:35.8%;
    height:9.2%;
}


/* للموبايل */

@media(max-width:700px){

    body{
        background:#050505;
        align-items:flex-start;
    }

    .design{
        margin-top:0;
    }

}

</style>

</head>

<body>


<div class="design">


    <!-- VIEW MENU -->

    <a
       class="link menu"
       href="luna.pdf"
       target="_blank"
       aria-label="View Menu">
    </a>


    <!-- INSTAGRAM -->

    <a
       class="link instagram"
       href="https://www.instagram.com/luna_cafeandrest"
       target="_blank"
       aria-label="Instagram">
    </a>


    <!-- SNAPCHAT -->

    <a
       class="link snapchat"
       href="https://snapchat.com/t/bYnMb9Fr"
       target="_blank"
       aria-label="Snapchat">
    </a>


    <!-- CALL -->

    <a
       class="link call"
       href="tel:07502352688"
       aria-label="Call Now">
    </a>


</div>


</body>
</html>
