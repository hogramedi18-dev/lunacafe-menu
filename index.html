<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA Cafe & Rest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;

    background:
      linear-gradient(rgba(0,0,0,.68),rgba(0,0,0,.82)),
      url("background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

.card{
    width:100%;
    max-width:520px;
    padding:42px 32px 35px;

    background:rgba(5,5,5,.88);

    border:1px solid #c9993e;
    border-radius:35px;

    backdrop-filter:blur(8px);

    box-shadow:
      0 20px 60px rgba(0,0,0,.8),
      0 0 30px rgba(201,153,62,.15);
}

.logo{
    text-align:center;
}

.moon{
    font-size:72px;
    filter:drop-shadow(0 0 13px rgba(255,190,60,.55));
}

h1{
    margin-top:5px;

    font-family:Georgia,serif;
    font-weight:normal;

    font-size:70px;
    letter-spacing:10px;

    background:linear-gradient(
      #fff0a8,
      #d29c38,
      #ffe39a
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:-4px;

    font-family:Georgia,serif;
    font-style:italic;

    font-size:31px;
    color:#d5a442;
}

.divider{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    margin:25px 0 17px;
}

.line{
    width:90px;
    height:1px;

    background:linear-gradient(
      to right,
      transparent,
      #d1a147
    );
}

.line.right{
    background:linear-gradient(
      to left,
      transparent,
      #d1a147
    );
}

.diamond{
    color:#d1a147;
}

.welcome{
    text-align:center;
    font-size:20px;
    margin-bottom:25px;
}

.btn{
    width:100%;

    display:flex;
    align-items:center;

    padding:16px 18px;
    margin:14px 0;

    color:white;
    text-decoration:none;

    background:linear-gradient(
      135deg,
      rgba(25,25,25,.96),
      rgba(5,5,5,.96)
    );

    border:1px solid #c9993e;
    border-radius:20px;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);

    background:#18130b;

    box-shadow:
      0 7px 25px rgba(0,0,0,.7),
      0 0 15px rgba(201,153,62,.25);
}

.icon{
    width:55px;
    height:55px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;

    margin-right:15px;
}

.text{
    flex:1;
}

.text strong{
    display:block;
    font-size:21px;
    margin-bottom:4px;
}

.text span{
    color:#aaa;
    font-size:14px;
}

.arrow{
    font-size:34px;
    color:#d5a442;
}

.features{
    margin-top:28px;
    text-align:center;

    color:#dfb65f;
    font-size:16px;
}

.footerLine{
    width:70%;
    height:1px;

    margin:23px auto;

    background:linear-gradient(
      to right,
      transparent,
      #c9993e,
      transparent
    );
}

.thanks{
    text-align:center;

    color:#d5a442;

    font-family:Georgia,serif;
    font-style:italic;

    font-size:18px;
}

.heart{
    text-align:center;
    color:#d5a442;
    margin-top:8px;
}

@media(max-width:500px){

    body{
        padding:15px 10px;
    }

    .card{
        padding:32px 18px 28px;
        border-radius:28px;
    }

    .moon{
        font-size:60px;
    }

    h1{
        font-size:50px;
        letter-spacing:7px;
    }

    .subtitle{
        font-size:25px;
    }

    .btn{
        padding:13px;
    }

    .icon{
        width:45px;
        font-size:26px;
    }

    .text strong{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">

        <div class="moon">🌙</div>

        <h1>LUNA</h1>

        <div class="subtitle">
            Cafe & Rest
        </div>

    </div>

    <div class="divider">
        <div class="line"></div>
        <div class="diamond">◇</div>
        <div class="line right"></div>
    </div>

    <div class="welcome">
        Welcome
    </div>
    <a href="luna.pdf"
       target="_blank"
       class="btn">

        <div class="icon">📖</div>

        <div class="text">
            <strong>View Menu</strong>
            <span>Browse our menu</span>
        </div>

        <div class="arrow">›</div>
    </a>


    <a href="https://www.instagram.com/luna_cafeandrest"
       target="_blank"
       class="btn">

        <div class="icon">📸</div>

        <div class="text">
            <strong>Instagram</strong>
            <span>Follow us on Instagram</span>
        </div>

        <div class="arrow">›</div>
    </a>


    <a href="https://snapchat.com/t/bYnMb9Fr"
       target="_blank"
       class="btn">

        <div class="icon">👻</div>

        <div class="text">
            <strong>Snapchat</strong>
            <span>Add us on Snapchat</span>
        </div>

        <div class="arrow">›</div>
    </a>


    <a href="tel:07502352688"
       class="btn">

        <div class="icon">📞</div>

        <div class="text">
            <strong>Call Now</strong>
            <span>Get in touch with us</span>
        </div>

        <div class="arrow">›</div>
    </a>


    <div class="features">
        👨‍👩‍👧 Family
        &nbsp; • &nbsp;
        🍴 Food
        &nbsp; • &nbsp;
        💨 Hookah
    </div>


    <div class="footerLine"></div>


    <div class="thanks">
        Thank you for choosing us
    </div>

    <div class="heart">♥️</div>

</div>

</body>
</html>
