<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA Cafe & Rest</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top, #2b2112 0%, #111 35%, #050505 100%);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:430px;
      background:rgba(10,10,10,.95);
      border:1px solid #c9972f;
      border-radius:28px;
      padding:34px 24px;
      box-shadow:0 0 35px rgba(201,151,47,.18);
      text-align:center;
    }

    .moon{
      font-size:70px;
      margin-bottom:5px;
      filter:drop-shadow(0 0 12px rgba(255,200,70,.35));
    }

    h1{
      font-family:Georgia, serif;
      font-size:52px;
      letter-spacing:5px;
      color:#d8aa4a;
      margin-bottom:3px;
    }

    .subtitle{
      font-family:Georgia, serif;
      font-size:28px;
      font-style:italic;
      color:#d8aa4a;
      margin-bottom:24px;
    }

    .welcome{
      font-size:19px;
      margin-bottom:24px;
      color:#eee;
    }

    .btn{
      display:flex;
      align-items:center;
      gap:15px;
      width:100%;
      text-decoration:none;
      color:white;
      background:#101010;
      border:1px solid #c9972f;
      border-radius:18px;
      padding:17px 18px;
      margin:13px 0;
      text-align:left;
      transition:.25s;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:#18140c;
      box-shadow:0 0 18px rgba(201,151,47,.18);
    }

    .icon{
      width:48px;
      height:48px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:27px;
      background:#191919;
      flex-shrink:0;
    }

    .text{
      flex:1;
    }

    .text strong{
      display:block;
      font-size:20px;
      margin-bottom:4px;
    }

    .text span{
      color:#aaa;
      font-size:14px;
    }

    .arrow{
      color:#d8aa4a;
      font-size:24px;
    }

    .footer{
      margin-top:25px;
      color:#d8aa4a;
      font-size:15px;
    }

    .thanks{
      margin-top:20px;
      font-family:Georgia, serif;
      font-style:italic;
      color:#d8aa4a;
      font-size:18px;
    }

    @media(max-width:480px){
      h1{
        font-size:42px;
      }

      .subtitle{
        font-size:24px;
      }

      .card{
        padding:28px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="moon">🌙</div>

    <h1>LUNA</h1>
    <div class="subtitle">Cafe & Rest</div>

    <div class="welcome">Welcome</div>

    <a class="btn" href="luna.pdf" target="_blank">
      <div class="icon">📖</div>
      <div class="text">
        <strong>View Menu</strong>
        <span>Browse our menu</span>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="btn"
       href="https://www.instagram.com/luna_cafeandrest"
       target="_blank">
      <div class="icon">📸</div>
      <div class="text">
        <strong>Instagram</strong>
        <span>Follow us on Instagram</span>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="btn"
       href="https://snapchat.com/t/bYnMb9Fr"
       target="_blank">
      <div class="icon">👻</div>
      <div class="text">
        <strong>Snapchat</strong>
        <span>Add us on Snapchat</span>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="btn" href="tel:07502352688">
      <div class="icon">📞</div>
      <div class="text">
        <strong>Call Now</strong>
        <span>Get in touch with us</span>
      </div>
      <div class="arrow">›</div>
    </a>

    <div class="footer">
      👨‍👩‍👧 Family &nbsp; • &nbsp; 🍴 Food &nbsp; • &nbsp; 💨 Hookah
    </div>

    <div class="thanks">
      Thank you for choosing us ♥️
    </div>

  </div>

</body>
</html>
